<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E3F0E0" />
    <title>ระบบบริหารแผงค้าตลาด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- หน้ารอโหลดก่อนไฟล์ JavaScript มาถึง (React จะแทนที่เมื่อพร้อม) — แบบเดียวกับ LoadingScreen.jsx -->
    <style>
      .boot{min-height:100dvh;display:grid;place-items:center;background:#f2f8f1;font-family:Sarabun,Tahoma,sans-serif;color:#4b5e50}
      .boot-mark{position:relative;width:96px;height:96px;margin:0 auto 16px}
      .boot-ring{position:absolute;inset:0;animation:boot-spin 1.1s linear infinite}
      .boot-icon{position:absolute;inset:0;margin:auto;width:50px;height:50px}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot-ring{animation-duration:4s}}
    </style>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div>
          <div class="boot-mark" aria-hidden="true">
            <svg class="boot-ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="43" fill="none" stroke="#cde5c7" stroke-width="5"/><circle cx="48" cy="48" r="43" fill="none" stroke="#2f7a3b" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 200"/></svg>
            <img class="boot-icon" src="/favicon.svg" alt="" />
          </div>
          <p style="margin:0;text-align:center">กำลังเปิด…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
